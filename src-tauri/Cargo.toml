[package]
name = "wxmp-cracker"
version = "0.3.10"
description = "微探：微信公众号内容采集与洞察工作台，Powered by Lovstudio"
authors = ["lovstudio"]
edition = "2021"

[lib]
name = "wxmp_cracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The macOS Dock uses the raw executable name while running `tauri dev`.
# Keep the crate package identifier stable, but give the user-facing binary
# the same name as the bundled app.
[[bin]]
name = "微探"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
tauri-plugin-log = "2"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
reqwest = { version = "0.13", features = ["json", "stream", "blocking", "cookies"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["time", "fs", "io-util"] }
base64 = "0.22"
flate2 = "1"
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
slug = "0.1"
regex = "1"
keyring = "3"
include_dir = "0.7"
futures-util = "0.3"
minisign-verify = "0.2"
notify = "8.2"
qbsdiff = "1.4"
tar = "0.4"
tempfile = "3"
urlencoding = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = { version = "0.25", features = ["elcapitan", "highsierra"] }
foreign-types = "0.5"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
